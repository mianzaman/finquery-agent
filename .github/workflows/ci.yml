name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Without a database the security tests skip, so CI runs one. The credentials are the
    # throwaway development defaults from app/config.py.
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finquery
          POSTGRES_PASSWORD: finquery
          POSTGRES_DB: finquery
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U finquery -d finquery"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q
