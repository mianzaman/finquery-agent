services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: finquery
      POSTGRES_PASSWORD: finquery
      POSTGRES_DB: finquery
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finquery -d finquery"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    # Migrations run before the server starts; they do nothing when the database is current.
    command:
      - sh
      - -c
      - python -m db.migrate && exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network the database is reached by service name on its own port.
      DATABASE_URL: postgresql+psycopg://finquery:finquery@db:5432/finquery
      READER_DATABASE_URL: postgresql+psycopg://agent_reader:reader_pw@db:5432/finquery
      # The embedding model is mounted from the host, so nothing is downloaded at start-up.
      HF_HUB_OFFLINE: "1"
      # The host's Ollama, seen from inside the container (localhost would be the container).
      # Only used when LLM_PROVIDER=ollama.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes:
      - appdata:/srv/data
      # Put there by `uv run python -m ingestion.build_embeddings` during the data load.
      - ./data/fastembed:/srv/data/fastembed:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/health", timeout=3)
      interval: 5s
      timeout: 5s
      retries: 20

  ui:
    build: .
    command:
      - streamlit
      - run
      - ui/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    environment:
      API_URL: http://api:8000
      # A local model on a CPU can need minutes for one question; a hosted one answers sooner.
      UI_TIMEOUT_SECONDS: "300"
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
