services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: finquery
      POSTGRES_PASSWORD: finquery
      POSTGRES_DB: finquery
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finquery -d finquery"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network the database is reached by service name on its own port.
      DATABASE_URL: postgresql+psycopg://finquery:finquery@db:5432/finquery
      READER_DATABASE_URL: postgresql+psycopg://agent_reader:reader_pw@db:5432/finquery
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  ui:
    build: .
    command:
      - streamlit
      - run
      - ui/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  pgdata:
